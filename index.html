<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Serein</title>
    <meta name="description" content="Videos from the topics you chose. Nothing else." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F0E" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Serein" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="bar" id="bar">
      <div class="bar__inner">
        <a class="wordmark" href="/" data-link>Serein</a>
        <form class="search" role="search" id="search-form" action="/search">
          <svg class="search__icon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.75" stroke="currentColor" stroke-width="1.5" />
            <path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input
            class="search__input"
            id="q"
            name="q"
            type="search"
            placeholder="Search videos"
            autocomplete="off"
            enterkeyhint="search"
            aria-label="Search videos"
          />
        </form>
        <div class="bar__end">
          <span class="countdown" id="countdown"></span>
          <button class="icon-btn" type="button" id="theme-toggle" aria-label="Switch theme">
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M17 12.3A7.5 7.5 0 0 1 7.7 3 7 7 0 1 0 17 12.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.5" />
              <path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M16 4l-1.4 1.4M5.4 14.6 4 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
