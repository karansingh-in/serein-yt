<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Serein</title>
    <meta name="description" content="Videos from the topics you chose. Nothing else." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F0E" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Serein" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="bar" id="bar">
      <div class="bar__inner">
        <a class="wordmark" href="/" data-link>Serein</a>
        <form class="search" role="search" id="search-form" action="/search">
          <svg class="search__icon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.75" stroke="currentColor" stroke-width="1.5" />
            <path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input
            class="search__input"
            id="q"
            name="q"
            type="search"
            placeholder="Search your topics"
            autocomplete="off"
            enterkeyhint="search"
            aria-label="Search your topics"
          />
        </form>
        <a class="bar__link" href="/settings" data-link>Settings</a>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
